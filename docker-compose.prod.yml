# Production orchestrator stack
#
# All services run on ronexa_net (172.18.1.0/24) with static IPs.
# Nginx uses Docker service names for proxy_pass — survives container restarts.
#
# Usage:
#   docker compose up -d                                  # start all
#   BACKEND_TAG=v63 docker compose up -d                  # deploy specific backend tag
#   docker compose logs -f backend-api                    # tail logs
#
# Deploy via: ./deploy.sh [auto|backend|frontend|all|restart|status]

services:
  restate:
    image: docker.restate.dev/restatedev/restate:1.6.2
    container_name: restate
    restart: always
    environment:
      - RESTATE_WORKER__INVOKER__ABORT_TIMEOUT=10m
    ports:
      - "8080:8080"
      - "9070:9070"
      - "9071:9071"
    volumes:
      - restate-data:/target
    networks:
      ronexa_net:
        ipv4_address: 172.18.1.10

  backend-api:
    image: ronexaacr.azurecr.io/backend-api:${BACKEND_TAG:-v62}
    container_name: backend-api
    restart: always
    ports: ["8000:8000"]
    env_file: .env
    environment:
      - RESTATE_URL=http://restate:8080
      - RESTATE_ADMIN_URL=http://restate:9071
      - ENVIRONMENT=production
    depends_on:
      - restate
    networks:
      ronexa_net:
        ipv4_address: 172.18.1.12

  restate-handler:
    image: ronexaacr.azurecr.io/backend-api:${BACKEND_TAG:-v62}
    container_name: restate-handler
    restart: always
    ports: ["9080:9080"]
    command: ["python3", "restate_worker.py"]
    env_file: .env
    environment:
      - RESTATE_URL=http://restate:8080
      - RESTATE_ADMIN_URL=http://restate:9071
      - ENVIRONMENT=production
    depends_on:
      - restate
    networks:
      ronexa_net:
        ipv4_address: 172.18.1.11

  frontend:
    image: ronexaacr.azurecr.io/auth-ops-frontend:${FRONTEND_TAG:-v43}
    container_name: frontend
    restart: always
    ports: ["3000:3000"]
    environment:
      - API_URL=http://backend-api:8000
    depends_on:
      - backend-api
    networks:
      ronexa_net:
        ipv4_address: 172.18.1.13

  nginx:
    image: nginx:alpine
    container_name: nginx
    restart: always
    ports: ["80:80"]
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend-api
      - frontend
    networks:
      ronexa_net:
        ipv4_address: 172.18.1.14

volumes:
  restate-data:

networks:
  ronexa_net:
    driver: bridge
    ipam:
      config:
        - subnet: 172.18.1.0/24
