server {
    listen 80;
    server_name _;

    # Allow uploads up to 20MB (clinical PDFs, Excel files)
    client_max_body_size 20m;

    # Health check
    location /health {
        proxy_pass http://backend-api:8000/api/health;
    }

    # All API routes → FastAPI backend (Docker Compose service name)
    location /api/ {
        proxy_pass http://backend-api:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
        proxy_connect_timeout 10s;
    }

    # Next.js static assets
    location /_next/ {
        proxy_pass http://auth-ops-frontend:3000;
        proxy_set_header Host $host;
        proxy_cache_valid 200 1d;
    }

    # Everything else → Auth ops frontend (Docker Compose service name)
    location / {
        proxy_pass http://auth-ops-frontend:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
